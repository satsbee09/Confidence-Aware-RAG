version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: confidence_rag_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./evaluation/results:/app/evaluation/results
    environment:
      - APP_NAME=Confidence-Aware RAG API
      - APP_ENV=production
      - SIMILARITY_WEIGHT=0.5
      - CONFIDENCE_WEIGHT=0.5
      - LOW_CONFIDENCE_THRESHOLD=0.5
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: confidence_rag_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: confidence_rag_network
